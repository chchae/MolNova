# Merge into a project TOML. Existing submitted jobs retain their saved backend.
prime-gbsa = true
prime-gbsa-local-compute = true
prime-gbsa-local-host = "adam"
prime-gbsa-local-work-dir = "/home1/prime_share"
prime-gbsa-local-schrodinger = "/home/schrodinger/2025-3-IL"
